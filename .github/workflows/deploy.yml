name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
        working-directory: bgpsim/bgpsim-web

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: bgpsim

      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Install tailwindcss (required by the trunk pre-build hook)
        run: npm install -g tailwindcss@3.4.17

      - name: Build
        run: trunk build --release
        working-directory: bgpsim/bgpsim-web

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: bgpsim/bgpsim-web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
